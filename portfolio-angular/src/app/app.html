<mat-sidenav-container class="container-app">

 <mat-sidenav #menu mode="over" [opened]="false">

    <h2 class="titulo-menu">Meu Portfólio</h2>

    <a mat-button routerLink="/" (click)="menu.close()">
      Início
    </a>

    <a mat-button routerLink="/sobre" (click)="menu.close()">
      Sobre
    </a>

    <a mat-button routerLink="/projetos" (click)="menu.close()">
      Projetos
    </a>

    <a mat-button routerLink="/contato" (click)="menu.close()">
      Contato
    </a>

    <a mat-button routerLink="/catalogo" routerLinkActive="ativo">Catálogo</a>
  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar>

      <button mat-icon-button (click)="menu.toggle()">
        ☰
      </button>

      <span>Meu Portfólio</span>

      <span class="espacador"></span>

      <div class="menu-desktop">

        <a
          mat-button
          routerLink="/"
          routerLinkActive="ativo"
          [routerLinkActiveOptions]="{ exact: true }">
          Início
        </a>

        <a
          mat-button
          routerLink="/sobre"
          routerLinkActive="ativo">
          Sobre
        </a>

        <a
          mat-button
          routerLink="/projetos"
          routerLinkActive="ativo">
          Projetos
        </a>

        <a
          mat-button
          routerLink="/contato"
          routerLinkActive="ativo">
          Contato
        </a>

      </div>

    </mat-toolbar>

    <main>
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
